<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Tasks</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<header class="top">
<span class="brand">deckhand</span>
<nav class="tabs" aria-label="View">
<a id="navlist" href="#/">Tasks</a>
<a id="navboard" href="#/board">Board</a>
</nav>
<span id="status" class="status" role="status" aria-live="polite"></span>
<button id="ask" class="askbtn" type="button">Ask <kbd id="askkey">⌘K</kbd></button>
</header>
<main id="app"></main>
<dialog id="chat" class="chat" aria-labelledby="chattitle">
<div class="chathead">
<h2 id="chattitle">Ask the assistant</h2>
<button id="chatclose" class="textbtn quiet" type="button" aria-label="Close (Esc)">Esc</button>
</div>
<ol id="chatlines" class="chatlines" aria-live="polite"></ol>
<p id="chatwait" class="note wait" role="status"></p>
<form id="chatform" class="chatform">
<textarea id="chattext" class="field" rows="3" placeholder="A new thing or a question" aria-label="Message to the assistant"></textarea>
<div class="chatfoot">
<span id="chatnote" class="note" role="status"></span>
<button class="button primary" type="submit">Send</button>
</div>
</form>
</dialog>
</body>
</html>
